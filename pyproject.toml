[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-revision-engine"
version = "0.1.0"
description = "Provider-neutral revision planning for paid agent work"
requires-python = ">=3.10"
dependencies = []

[tool.vercel]
entrypoint = "app:app"

[project.scripts]
delta-demo = "delta.web:main"

[project.optional-dependencies]
sibyl = ["sibyl-memory-client>=0.8,<0.9"]
baseline = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]

[tool.setuptools.packages.find]
include = ["delta*"]
